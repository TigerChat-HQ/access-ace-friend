name: Refresh dependency lockfiles

on:
  push:
    branches: [fix/tigerchat-lint-batch]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tigerchat-lint-batch
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@v2
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Refresh Bun lockfile
        run: bun install --lockfile-only
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfiles"
          git pull --rebase origin fix/tigerchat-lint-batch
          git push
