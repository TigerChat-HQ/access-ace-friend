name: Refresh and verify dependencies

on:
  push:
    branches:
      - feature/tigerchat-status-upgrades
    paths:
      - '.github/workflows/dependency-refresh.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
  pull_request:
    branches:
      - stage3/publishing-undo
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate dependency compatibility
        run: |
          node --version
          npm --version
          bun --version
          npm pkg get dependencies.vite-plugin-pwa devDependencies.vite-plugin-pwa devDependencies.drizzle-kit overrides

      - name: Regenerate npm lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --legacy-peer-deps

      - name: Install npm dependency tree
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Refresh production dependencies and apply non-breaking fixes
        run: |
          npm update react-router-dom zod @supabase/supabase-js --omit=dev --ignore-scripts --no-audit --legacy-peer-deps
          npm audit fix --omit=dev --legacy-peer-deps
          npm audit fix --legacy-peer-deps
          npm install --package-lock-only --ignore-scripts --no-audit --legacy-peer-deps

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Report remaining development-tool advisories
        continue-on-error: true
        run: |
          npm audit --audit-level=low

      - name: Regenerate Bun lockfile from audited manifest
        run: bun install --lockfile-only

      - name: Verify Bun frozen lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck, tests, and production build
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Re-check production audit and lockfile consistency
        run: |
          npm audit --omit=dev --audit-level=low
          git diff --check
          test -f package-lock.json
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- package.json package-lock.json bun.lock; then
            echo "Manifests and lockfiles are synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json bun.lock
          git commit -m "fix(security): synchronize dependency lockfiles"
          git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
