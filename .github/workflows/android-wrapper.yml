name: Android wrapper CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/android-wrapper.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/android-wrapper.yml"

permissions:
  contents: write

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # Android v1.0.32 release build.
      TIGER_VERSION_CODE: 32
      TIGER_VERSION_NAME: 1.0.32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Check Android signing configuration
        id: signing
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure and validate Firebase Android app
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.TIGERCHAT_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG" ]; then
            echo "::error::Missing GitHub Actions secret TIGERCHAT_ANDROID_GOOGLE_SERVICES_JSON."
            exit 1
          fi

          printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json

          if ! jq -e --arg package "com.tigerchats.app" '
            .project_info.project_id == "tigerchat-39e19"
            and any(.client[]?;
              .client_info.android_client_info.package_name == $package
              and (.client_info.mobilesdk_app_id | type == "string" and length > 0)
              and any(.api_key[]?; .current_key | type == "string" and length > 0)
            )
          ' android/app/google-services.json >/dev/null; then
            echo "::error::Firebase JSON is invalid or does not contain the expected TigerChats Android app (project tigerchat-39e19, package com.tigerchats.app)."
            exit 1
          fi

          echo "Firebase configuration validated for com.tigerchats.app."
      - name: Copy Chrome PWA icon into Android launcher resources
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/pwa-icon-512.png android/app/src/main/res/drawable-nodpi/tigerchats_logo.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure stable Android release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigerchats-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tigerchats-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle -p android :app:assembleRelease -PtigerVersionCode="$TIGER_VERSION_CODE" -PtigerVersionName="$TIGER_VERSION_NAME"
      - name: Assemble debug APK
        if: steps.signing.outputs.configured != 'true'
        run: gradle -p android :app:assembleDebug -PtigerVersionCode="$TIGER_VERSION_CODE" -PtigerVersionName="$TIGER_VERSION_NAME"
      - name: Name APK for download
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/TigerChats.apk
            echo "APK_PATH=android/app/build/outputs/apk/release/TigerChats.apk" >> "$GITHUB_ENV"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TigerChats.apk
            echo "APK_PATH=android/app/build/outputs/apk/debug/TigerChats.apk" >> "$GITHUB_ENV"
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tigerchats-android-${{ env.TIGER_VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
      - name: Publish latest Android APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TIGERCHATS Android v${{ env.TIGER_VERSION_NAME }}
          body: "Latest automatically built TIGERCHATS Android installer. Version: ${{ env.TIGER_VERSION_NAME }}. Signed release is used when the Android signing secrets are configured."
          files: ${{ env.APK_PATH }}
          make_latest: false
          fail_on_unmatched_files: true
