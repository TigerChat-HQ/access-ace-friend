name: Android wrapper CI

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/components/NativePushRegistration.tsx"
      - "src/components/AppShell.tsx"
      - ".github/workflows/android-wrapper.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Configure Firebase Android app
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.TIGERCHAT_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tigerchats-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
