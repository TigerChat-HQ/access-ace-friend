name: Tiger AI security auto-fix

on:
  workflow_run:
    workflows: ["Dependency security audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: tiger-ai-security-autofix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair-dependency-vulnerabilities:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate originating pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            const pr = prs.find(item =>
              item.base?.ref === 'main' &&
              item.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            if (!pr) {
              core.notice('No same-repository PR targeting main was attached to this failed audit. No write action taken.');
              core.setOutput('eligible', 'false');
              return;
            }
            core.setOutput('eligible', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);

      - name: Check out the exact audited PR commit
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: true

      - name: Set up Node.js
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply safe, lockfile-only dependency fixes
        if: steps.pr.outputs.eligible == 'true'
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No safe lockfile-only repair was available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create isolated repair branch and commit
        if: steps.pr.outputs.eligible == 'true' && steps.repair.outputs.changed == 'true'
        id: commit
        env:
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          FIX_BRANCH="tiger-ai/security-fix-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$FIX_BRANCH"
          git add package.json package-lock.json
          git commit -m "fix(security): repair audited dependency vulnerabilities"
          git push origin "HEAD:$FIX_BRANCH"
          echo "fix_branch=$FIX_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open repair PR against the original PR branch
        if: steps.pr.outputs.eligible == 'true' && steps.repair.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_BRANCH: ${{ steps.commit.outputs.fix_branch }}
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
          SOURCE_PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base "$SOURCE_BRANCH" \
            --head "$FIX_BRANCH" \
            --title "Tiger AI security fix for PR #$SOURCE_PR" \
            --body "## Tiger AI proposed security fix

          The dependency security audit failed for PR #$SOURCE_PR. Tiger AI applied compatible, lockfile-only npm security updates on an isolated branch.

          - Original PR: #$SOURCE_PR
          - Fix scope: package manifests and lockfile only
          - Validation: production and full dependency audits must both pass at low severity
          - No secrets, application source, or security rules were changed

          This repair PR targets the original PR branch. Review the diff and required checks before merging."

      - name: Escalate failures that cannot be safely auto-fixed
        if: always() && steps.pr.outputs.eligible == 'true' && (steps.repair.outcome == 'failure' || steps.repair.outputs.changed == 'false')
        run: |
          {
            echo "## Tiger AI security repair needs administrator review"
            echo "The failed dependency audit could not be resolved by compatible lockfile-only updates."
            echo "No audit finding was suppressed and no security check was bypassed."
            echo "Inspect the dependency audit report; a breaking upgrade, unavailable patch, or non-dependency security issue may require a human decision."
          } >> "$GITHUB_STEP_SUMMARY"
