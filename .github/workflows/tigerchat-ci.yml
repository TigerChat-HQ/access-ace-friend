name: TIGERCHAT CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tigerchat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Generate and commit synchronized npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript project checks
        run: npm run typecheck

      - name: Verify 20 CC0 status music tracks
        run: node scripts/check-status-audio.mjs

      - name: Lint changed Stage 2 files
        run: |
          npx eslint src/lib/tiger-planner.test.ts
          npx eslint supabase/functions/tiger-dev-planner/index.ts

      - name: Full repository lint
        run: npm run lint

      - name: Unit tests
        if: always()
        run: npm run test

      - name: Production build
        if: always()
        run: npm run build
