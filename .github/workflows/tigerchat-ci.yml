name: TIGERCHAT CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tigerchat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript project checks
        run: bun run typecheck

      - name: Lint changed Stage 2 files
        run: |
          bunx eslint src/lib/tiger-planner.test.ts
          bunx eslint supabase/functions/tiger-dev-planner/index.ts --rule '@typescript-eslint/no-explicit-any: off'

      - name: Legacy repository lint baseline
        run: bun run lint
        continue-on-error: true

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
