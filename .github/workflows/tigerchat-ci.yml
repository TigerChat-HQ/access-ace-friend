name: TIGERCHAT CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tigerchat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install dependencies
        run: npm ci

      - name: TypeScript project checks
        run: npm run typecheck

      - name: Verify 20 status music tracks
        run: node scripts/check-status-audio.mjs

      - name: Lint changed Stage 2 files
        run: |
          npx eslint src/lib/tiger-planner.test.ts
          npx eslint supabase/functions/tiger-dev-planner/index.ts

      - name: Full repository lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
