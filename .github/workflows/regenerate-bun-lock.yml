name: Regenerate Bun lockfile

on:
  push:
    branches: [migration/remove-lovable]
    paths: [package.json, .github/workflows/regenerate-bun-lock.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/remove-lovable
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile from public package registries
        run: bun install --lockfile-only
      - name: Open lockfile update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/regenerate-bun-lock
          git add bun.lock
          git commit -m "Regenerate Bun lockfile without Lovable dependencies"
          git push --force origin automation/regenerate-bun-lock
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base migration/remove-lovable \
            --head automation/regenerate-bun-lock \
            --title "Regenerate Bun lockfile without Lovable dependencies" \
            --body "Automated dependency lockfile refresh after removing Lovable packages. CI must pass before merging." \
            || gh pr view automation/regenerate-bun-lock --repo "$GITHUB_REPOSITORY"
