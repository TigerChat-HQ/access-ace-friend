name: Tiger AI checks
# Runs tests, build and security checks on every suggested update (pull request).
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
      - run: bun run build

  books-ai-edge-function:
    name: Books AI Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check daily Books AI publisher
        run: deno check --node-modules-dir=none supabase/functions/tiger-books-ai/index.ts
      - name: Type-check Smart Card AI reply function
        run: deno check --node-modules-dir=none supabase/functions/tiger-ai-smart-card-reply/index.ts

  security:
    name: Security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev --package-lock-only
      - name: Secret leak scan
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{32,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github'; then
            echo "Possible secret found in code"; exit 1
          fi
