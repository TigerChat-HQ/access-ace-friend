name: Deploy TIGERCHAT to Cloudflare Pages

# TigerChat is published through Lovable. Cloudflare deployment is intentionally
# disabled so pushes to main do not attempt an unrequested Cloudflare release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishing-target:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm publishing target
        run: |
          echo "Cloudflare deployment is disabled by project publishing policy."
          echo "Use the connected Lovable project to preview and publish TigerChat."
          echo "No deployment was attempted."
