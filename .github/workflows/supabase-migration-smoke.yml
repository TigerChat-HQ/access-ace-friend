name: Supabase migration smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/security/**"
      - ".github/workflows/supabase-migration-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/security/**"
      - ".github/workflows/supabase-migration-smoke.yml"

permissions:
  contents: read

jobs:
  postgres-migration-smoke:
    name: PostgreSQL migration and security behavior tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigerchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tigerchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tigerchat_test
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Prepare minimal Supabase auth and security fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA private;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$
              SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            $$;

          CREATE TYPE public.app_role AS ENUM ('admin', 'superior_admin', 'moderator', 'adviser');
          CREATE TABLE public.user_roles (user_id uuid NOT NULL, role public.app_role NOT NULL, PRIMARY KEY(user_id, role));
          CREATE TABLE public.conversation_members (conversation_id uuid NOT NULL, user_id uuid NOT NULL, PRIMARY KEY(conversation_id, user_id));
          CREATE TABLE public.story_audience_members (story_id uuid NOT NULL, member_id uuid NOT NULL, audience_type text NOT NULL, PRIMARY KEY(story_id, member_id, audience_type));
          CREATE TABLE public.draft_matches (
            id uuid PRIMARY KEY, player_white uuid NOT NULL, player_black uuid,
            current_turn text NOT NULL, revision integer NOT NULL DEFAULT 0,
            status text NOT NULL, board jsonb NOT NULL, vs_ai boolean NOT NULL DEFAULT false,
            white_clock_ms bigint, black_clock_ms bigint, initial_clock_seconds integer,
            increment_seconds integer DEFAULT 0, clock_started_at timestamptz,
            last_move jsonb, winner text, draw_offer_by uuid, updated_at timestamptz DEFAULT now()
          );

          CREATE TABLE private.chat_presence (user_id uuid PRIMARY KEY, last_seen_at timestamptz NOT NULL DEFAULT now());
          CREATE TABLE public.tiger_ai_daily_config (id integer PRIMARY KEY);
          CREATE TABLE public.tiger_books_ai_config (id integer PRIMARY KEY);
          ALTER TABLE private.chat_presence ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.tiger_ai_daily_config ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.tiger_books_ai_config ENABLE ROW LEVEL SECURITY;

          INSERT INTO auth.users(id) VALUES
            ('00000000-0000-0000-0000-000000000001'),
            ('00000000-0000-0000-0000-000000000002');
          INSERT INTO public.user_roles(user_id, role)
            VALUES ('00000000-0000-0000-0000-000000000001', 'admin');
          INSERT INTO public.conversation_members(conversation_id, user_id)
            VALUES ('00000000-0000-0000-0000-000000000101', '00000000-0000-0000-0000-000000000001');
          INSERT INTO public.story_audience_members(story_id, member_id, audience_type)
            VALUES ('00000000-0000-0000-0000-000000000201', '00000000-0000-0000-0000-000000000001', 'include');
          SQL

      - name: Apply relevant migrations twice (idempotency check)
        run: |
          for migration in \
            supabase/migrations/20261109020000_device_push_tokens.sql \
            supabase/migrations/20261112140000_harden_service_managed_table_rls.sql \
            supabase/migrations/20261112150000_scope_security_definer_helpers_to_caller.sql \
            supabase/migrations/20261112160000_validate_draughts_moves_server_side.sql; do
            test -s "$migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify schema, grants and SECURITY DEFINER behavior
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/security/rls_security_definer_assertions.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.device_push_tokens') IS NULL THEN
              RAISE EXCEPTION 'device_push_tokens table is missing';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.device_push_tokens'::regclass) THEN
              RAISE EXCEPTION 'device_push_tokens RLS is not enabled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'device_push_tokens'
                AND policyname = 'Users manage their own push tokens'
            ) THEN
              RAISE EXCEPTION 'Expected push token RLS policy is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.device_push_tokens'::regclass
                AND conname = 'device_push_tokens_user_token_key'
                AND contype = 'u'
            ) THEN
              RAISE EXCEPTION 'Push token unique constraint is missing';
            END IF;
            IF to_regclass('public.device_push_tokens_user_id_idx') IS NULL THEN
              RAISE EXCEPTION 'Push token user index is missing';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.device_push_tokens', 'SELECT,INSERT,UPDATE,DELETE') THEN
              RAISE EXCEPTION 'Expected authenticated push token grants are missing';
            END IF;
          END;
          $$;
          SQL
