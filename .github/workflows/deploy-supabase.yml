name: Deploy TIGERCHATS Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'dngilyoyhmgazhuuaxfh' }}
    steps:
      - name: Explain manual deployment status
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "GitHub automatic deployment is not configured; the five Edge Functions have already been deployed directly to the target Supabase project."

      - name: Checkout
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if compgen -G "supabase/migrations/*.sql" > /dev/null; then
            supabase db push --linked --yes
          else
            echo "No database migrations to apply."
          fi

      - name: Deploy all Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        shell: bash
        run: |
          for function_dir in supabase/functions/*; do
            if [[ -f "$function_dir/index.ts" ]]; then
              function_name="$(basename "$function_dir")"
              echo "Deploying $function_name"
              supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done
